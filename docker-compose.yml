services:

  # ── NexusOSINT FastAPI backend ──────────────────────────────────────────
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-osint
    restart: unless-stopped
    stop_grace_period: 35s
    working_dir: /app
    # Uvicorn starts via entrypoint.sh so Alembic runs before privilege drop.
    security_opt:
      - no-new-privileges:true
    environment:
      - OATHNET_API_KEY=${OATHNET_API_KEY}
      - SPIDERFOOT_URL=http://spiderfoot:5001
      - APP_PASSWORD=${APP_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://nexusosint.uk}
      - LOG_LEVEL=WARNING
      - PYTHONPATH=/app
      - ENV=prod
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      - CACHE_KEY_PREFIX=${CACHE_KEY_PREFIX:-nexus:v1:search}
      - CACHE_FAIL_OPEN=${CACHE_FAIL_OPEN:-true}
      - CACHE_MAX_VALUE_BYTES=${CACHE_MAX_VALUE_BYTES:-262144}
      - DATABASE_URL=${DATABASE_URL:-}
      - READ_ONLY_MODE=${READ_ONLY_MODE:-false}
    volumes:
      - nexus_data:/app/data
      - ./api:/app/api:ro
      - ./static:/app/static:ro
      - ./modules:/app/modules:ro
    # SEC-HIGH-1 (2026-04-23): porta 8000 NÃO publicada no host.
    # Nginx alcança via rede interna Docker DNS (http://nexus:8000).
    # Publicar no host bypassa nginx (CSP, HSTS, rate_limit) e UFW é
    # ineficaz no Docker (regra DNAT em PREROUTING não passa pelo INPUT).
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2500m
        reservations:
          memory: 200m
    mem_swappiness: 10
    memswap_limit: 2800m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-nexusosint}
      - POSTGRES_USER=${POSTGRES_USER:-nexus}
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C.UTF-8 --data-checksums
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=8MB
        -c max_connections=20
        -c idle_in_transaction_session_timeout=60s
        -c shared_preload_libraries=pg_stat_statements
        -c maintenance_work_mem=64MB
        -c effective_cache_size=768MB
        -c jit=off
        -c log_min_duration_statement=1000
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - pg_password
    mem_limit: 768m
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 300m
    networks:
      - internal

  # ── Nginx reverse proxy + SSL ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru --timeout 0 --tcp-keepalive 60
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/etc/nginx/static:ro
      - certbot_www:/var/www/certbot:ro
      - ./certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - nexus
    networks:
      - internal
      - external

  # ── Certbot (Let's Encrypt auto-renewal) ──────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: nexus-certbot
    security_opt:
      - no-new-privileges:true
    volumes:
      - certbot_www:/var/www/certbot
      - ./certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  nexus_data:
    driver: local
  certbot_www:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

secrets:
  pg_password:
    file: ./secrets/pg_password.txt

networks:
  internal:
    driver: bridge
    name: nexus_net
  external:
    driver: bridge
